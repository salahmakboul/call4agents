<text x="84" y="25" fill="#8b98a5" style="font-size:13px">An agent crashes right after sending an email, then resumes (real output, fake models, no API keys)</text>
<text class="l0" x="22" y="58" fill="#f2c14e">$ pip install call4agents &amp;&amp; call4agents quickstart</text>
<text class="l1" x="22" y="80" fill="#d7dde4">Plain Python - crash right after an email is sent, then resume:</text>
<text class="l2" x="22" y="102" fill="#ff6b6b">  without the run record                        emails sent: 2</text>
<text class="l3" x="22" y="124" fill="#4cd38a">  with the run record (crash after the tool)    emails sent: 1</text>
<text class="l4" x="22" y="146" fill="#4cd38a">  with the run record (crash inside the tool)   emails sent: 1 (refused to resend: in doubt)</text>
<text class="l5" x="22" y="168" fill="#4cd38a">  &quot;yes&quot; to pay(10, alice), call changed to pay(9999, mallory): REFUSED; approved call: PAID; payments: 1</text>
<text class="l6" x="22" y="190" fill="#d7dde4">Frameworks found: LangGraph, Pydantic AI, OpenAI Agents SDK</text>
<text class="l7" x="22" y="212" fill="#ff6b6b">  LangGraph          crash after the email, resume:  without call4agents 2 emails,  with call4agents 1</text>
<text class="l8" x="22" y="234" fill="#ff6b6b">  Pydantic AI        crash after the email, resume:  without call4agents 2 emails,  with call4agents 1</text>
