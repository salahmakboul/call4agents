<rect width="940" height="632" rx="10" fill="#14181f"/>
<circle cx="22" cy="20" r="6" fill="#ff5f56"/><circle cx="42" cy="20" r="6" fill="#ffbd2e"/><circle cx="62" cy="20" r="6" fill="#27c93f"/>
<text class="l0" x="22" y="58" fill="#f2c14e">$ pip install call4agents &amp;&amp; call4agents crashtest --demo</text><text class="l1" x="22" y="80" fill="#ff6b6b">A small agent refunds a customer. Without the guard:</text><text class="l2" x="22" y="102" fill="#d7dde4"> </text><text class="l3" x="22" y="124" fill="#d7dde4">call4agents crashtest (experimental): crashtest_agent.py</text><text class="l4" x="22" y="146" fill="#d7dde4">Clean run: 1 action(s), 7 crash points. Killed and restarted 7 time(s).</text><text class="l5" x="22" y="168" fill="#d7dde4"> </text><text class="l6" x="22" y="190" fill="#ff6b6b">  RAN TWICE       refund(order=&#x27;A-1042&#x27;, amount=49)</text><text class="l7" x="22" y="212" fill="#d7dde4">    in 3 of 7 crashes, first when killed before a saved write</text><text class="l8" x="22" y="234" fill="#d7dde4"> </text><text class="l9" x="22" y="256" fill="#d7dde4">The one-line fix:</text><text class="l10" x="22" y="278" fill="#d7dde4"> </text><text class="l11" x="22" y="300" fill="#d7dde4">import call4agents as c4a</text><text class="l12" x="22" y="322" fill="#d7dde4">@c4a.effect                     # put it on the action, inside c4a.run(your_run_id)</text><text class="l13" x="22" y="344" fill="#d7dde4"> </text><text class="l14" x="22" y="366" fill="#d7dde4">Then run this test again.</text><text class="l15" x="22" y="388" fill="#d7dde4"> </text><text class="l16" x="22" y="410" fill="#4cd38a">The same agent with the one line added:</text><text class="l17" x="22" y="432" fill="#d7dde4"> </text><text class="l18" x="22" y="454" fill="#d7dde4">call4agents crashtest (experimental): crashtest_agent.py</text><text class="l19" x="22" y="476" fill="#d7dde4">Clean run: 1 action(s), 9 crash points. Killed and restarted 9 time(s).</text><text class="l20" x="22" y="498" fill="#d7dde4"> </text><text class="l21" x="22" y="520" fill="#d7dde4">  4 restart(s) stopped as in doubt instead of repeating: a person or the provider settles those.</text><text class="l22" x="22" y="542" fill="#d7dde4"> </text><text class="l23" x="22" y="564" fill="#4cd38a">No action ran twice and no unapproved call ran, at the points tested.</text><text class="l24" x="22" y="586" fill="#d7dde4">This covers this script, this path and these crash points. It is not a proof for other paths.</text>
</svg>
