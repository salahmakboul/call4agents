ite}@keyframes a18{0%,66.4%{opacity:0}67.9%,96%{opacity:1}100%{opacity:0}}.l19{animation:a19 28.0s linear infinite}@keyframes a19{0%,70.0%{opacity:0}71.5%,96%{opacity:1}100%{opacity:0}}.l20{animation:a20 28.0s linear infinite}@keyframes a20{0%,73.6%{opacity:0}75.1%,96%{opacity:1}100%{opacity:0}}.l21{animation:a21 28.0s linear infinite}@keyframes a21{0%,77.1%{opacity:0}78.6%,96%{opacity:1}100%{opacity:0}}.l22{animation:a22 28.0s linear infinite}@keyframes a22{0%,80.7%{opacity:0}82.2%,96%{opacity:1}100%{opacity:0}}.l23{animation:a23 28.0s linear infinite}@keyframes a23{0%,84.3%{opacity:0}85.8%,96%{opacity:1}100%{opacity:0}}.l24{animation:a24 28.0s linear infinite}@keyframes a24{0%,87.9%{opacity:0}89.4%,96%{opacity:1}100%{opacity:0}}
