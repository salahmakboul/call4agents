<rect width="100%" height="100%" rx="10" fill="#141a20"/>
<circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
<text x="84" y="25" fill="#8b98a5" style="font-size:13px">Three approval incidents, without and with Call4Agents (real output, no API keys)</text>
<text class="l0" x="22" y="58" fill="#f2c14e">$ call4agents incident</text>
<text class="l1" x="22" y="80" fill="#f2c14e">Incident 1. The double payment</text>
<text class="l2" x="22" y="102" fill="#d7dde4">  A person approves pay(10, alice). The bank charges. The process dies before saving. It resumes.</text>
<text class="l3" x="22" y="124" fill="#ff6b6b">  without Call4Agents    charges: 2  paid: 10 to alice, 10 to alice</text>
<text class="l4" x="22" y="146" fill="#4cd38a">  with Call4Agents       charges: 1  paid: 10 to alice</text>
<text class="l5" x="22" y="168" fill="#d7dde4">  The same, but the process dies inside the call, so nobody knows if it finished:</text>
<text class="l6" x="22" y="190" fill="#ff6b6b">  without Call4Agents    charges: 2  paid: 10 to alice, 10 to alice</text>
<text class="l7" x="22" y="212" fill="#4cd38a">  with Call4Agents       charges: 1  paid: 10 to alice (stopped: in doubt, a person must check)</text>
<text class="l8" x="22" y="234" fill="#f2c14e">Incident 2. The changed call</text>
<text class="l9" x="22" y="256" fill="#d7dde4">  A person approves pay(10, alice). The saved call is changed to pay(9999, mallory) before it runs.</text>
<text class="l10" x="22" y="278" fill="#ff6b6b">  without Call4Agents    charges: 1  paid: 9999 to mallory</text>
<text class="l11" x="22" y="300" fill="#4cd38a">  with Call4Agents       charges: 0  paid: nothing (refused: no yes for this exact call)</text>
<text class="l12" x="22" y="322" fill="#f2c14e">Incident 3. The ignored no</text>
<text class="l13" x="22" y="344" fill="#d7dde4">  A person says no to pay(10, alice). A bug in the agent loop runs the call anyway.</text>
<text class="l14" x="22" y="366" fill="#ff6b6b">  without Call4Agents    charges: 1  paid: 10 to alice</text>
<text class="l15" x="22" y="388" fill="#4cd38a">  with Call4Agents       charges: 0  paid: nothing (refused: no yes for this exact call)</text>
<text class="l16" x="22" y="410" fill="#d7dde4">The processes and crashes are real; the bank and the agent loop are small local stand-ins.</text>
</svg>
