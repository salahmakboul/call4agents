.l0{animation:a0 22.0s linear infinite}@keyframes a0{0%,2.7%{opacity:0}4.2%,96%{opacity:1}100%{opacity:0}}.l1{animation:a1 22.0s linear infinite}@keyframes a1{0%,6.8%{opacity:0}8.3%,96%{opacity:1}100%{opacity:0}}.l2{animation:a2 22.0s linear infinite}@keyframes a2{0%,10.9%{opacity:0}12.4%,96%{opacity:1}100%{opacity:0}}.l3{animation:a3 22.0s linear infinite}@keyframes a3{0%,15.0%{opacity:0}16.5%,96%{opacity:1}100%{opacity:0}}.l4{animation:a4 22.0s linear infinite}@keyframes a4{0%,19.1%{opacity:0}20.6%,96%{opacity:1}100%{opacity:0}}.l5{animation:a5 22.0s linear infinite}@keyframes a5{0%,23.2%{opacity:0}24.7%,96%{opacity:1}100%{opacity:0}}.l6{animation:a6 22.0s linear infinite}@keyframes a6{0%,27.3%{opacity:0}28.8%,96%{opacity:1}100%{opacity:0}}.l7{animation:a7 22.0s linear infinite}@keyframes a7{0%,31.4%{opacity:0}32.9%,96%{opacity:1}100%{opacity:0}}.l8{animation:a8 22.0s linear infinite}@keyframes a8{0%,35.5%{opacity:0}37.0%,96%{opacity:1}100%{opacity:0}}.l9{animation:a9 22.0s linear infinite}@keyframes a9{0%,39.5%{opacity:0}41.0%,96%{opacity:1}100%{opacity:0}}.l10{animation:a10 22.0s linear infinite}@keyframes a10{0%,43.6%{opacity:0}45.1%,96%{opacity:1}100%{opacity:0}}.l11{animation:a11 22.0s linear infinite}@keyframes a11{0%,47.7%{opacity:0}49.2%,96%{opacity:1}100%{opacity:0}}.l12{animation:a12 22.0s linear infinite}@keyframes a12{0%,51.8%{opacity:0}53.3%,96%{opacity:1}100%{opacity:0}}.l13{animation:a13 22.0s linear infinite}@keyframes a13{0%,55.9%{opacity:0}57.4%,96%{opacity:1}100%{opacity:0}}.l14{animation:a14 22.0s linear infinite}@keyframes a14{0%,60.0%{opacity:0}61.5%,96%{opacity:1}100%{opacity:0}}.l15{animation:a15 22.0s linear infinite}@keyframes a15{0%,64.1%{opacity:0}65.6%,96%{opacity:1}100%{opacity:0}}.l16{animation:a16 22.0s linear infinite}@keyframes a16{0%,68.2%{opacity:0}69.7%,96%{opacity:1}100%{opacity:0}}
