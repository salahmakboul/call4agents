<svg xmlns="http://www.w3.org/2000/svg" width="940" height="456" viewBox="0 0 940 456" role="img"
 aria-label="call4agents incident: a double payment, a changed call and an ignored no. Without call4agents they all happen; with it, none do.">
<title>call4agents incident: three approval incidents</title>
<style>
