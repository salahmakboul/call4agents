[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "call4agents"
version = "0.1.0"
description = "Once-only actions, approvals bound to exact arguments, and record/replay for Python AI agents"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Salah Eddine Makboul" }]
keywords = ["ai-agents", "langgraph", "pydantic-ai", "openai-agents", "idempotency", "approvals", "human-in-the-loop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = []   # standard library only

[project.urls]
Repository = "https://github.com/salahmakboul/call4agents"
Issues = "https://github.com/salahmakboul/call4agents/issues"
Changelog = "https://github.com/salahmakboul/call4agents/blob/main/CHANGELOG.md"

[project.scripts]
call4agents = "call4agents.__main__:main"

[tool.setuptools]
packages = ["call4agents", "call4agents.adapters", "call4agents.examples"]
