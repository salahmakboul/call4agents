name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  kit:
    name: kit ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install (no dependencies)
        run: python -m pip install .
      - run: call4agents doctor
      - run: call4agents quickstart
      - run: python -m tests.test_c4a_kit
      - run: python -m tests.test_c4a_production
      - run: python -m tests.test_idempotency
      - run: python -m tests.test_undo
      - run: python -m tests.stress_c4a_ledger
      - name: big test (quick size)
        run: python -m tests.bigtest_c4a --quick

  frameworks:
    name: frameworks ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install the kit and the real frameworks
        run: python -m pip install . langgraph langgraph-checkpoint-sqlite langchain pydantic-ai openai-agents openai pydantic mcp
      - run: call4agents doctor
      - name: quickstart must find and pass all three frameworks
        shell: bash
        run: |
          call4agents quickstart | tee quickstart.txt
          grep -q "Frameworks found: LangGraph, Pydantic AI, OpenAI Agents SDK" quickstart.txt
          test "$(grep -c 'with call4agents 1' quickstart.txt)" = "3"
      - run: python -m tests.framework_kill_langgraph
      - run: python -m tests.sdk_types_replay
      - run: python -m tests.test_c4a_kit
      - name: adapters with the real frameworks (Pydantic AI, OpenAI Agents SDK, MCP)
        run: python -m tests.test_adapters
      - name: the copy-and-run examples
        shell: bash
        run: |
          for m in pydantic_ai_tool openai_agents_tool mcp_tool; do python -m call4agents.examples.$m; done

  shared-record:
    name: shared record (PostgreSQL) ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the kit with the postgres extra, and a throwaway local PostgreSQL (pgserver)
        run: python -m pip install ".[postgres]" pgserver
      - run: python -m tests.test_shared_record

  mutations:
    name: bug re-insertion checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: what the shared-record checks need (psycopg and a local PostgreSQL)
        run: python -m pip install "psycopg[binary]" pgserver
      - run: python -m tests.mutations.run_kit_mutations

  leaks:
    name: secrets, personal data, internal files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m tests.secret_scan
      - run: python -m tests.secret_scan --history
      - name: build the package and check what is inside
        run: |
          python -m pip install build
          python -m build
          python -m tests.check_release dist
