name: adapters-more

# CrewAI, LlamaIndex and smolagents adapters, with the real frameworks (scripted models, offline).
# The three install together (checked on Windows: pip check finds no conflict). Nothing is pinned.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapters-more:
    name: CrewAI + LlamaIndex + smolagents ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CREWAI_DISABLE_TELEMETRY: "true"
      OTEL_SDK_DISABLED: "true"
      CREWAI_TRACING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the kit and the three frameworks
        run: python -m pip install . crewai llama-index-core smolagents
      - name: show versions
        run: python -m pip show crewai llama-index-core smolagents
      - name: adapters with the real frameworks (offline)
        run: python -m tests.test_adapters_more --require-frameworks --no-crashtest
      - name: crashtest on the real agents (about 45 min; Linux only, to keep macOS and Windows runners free)
        if: matrix.os == 'ubuntu-latest'
        run: python -m tests.test_adapters_more --require-frameworks --only-crashtest
