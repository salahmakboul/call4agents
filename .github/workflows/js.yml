name: js

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24"]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Python kit (for the cross-language key and record tests)
        working-directory: .
        run: python -m pip install .
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - name: Tests (Python and both frameworks required, never skipped)
        run: npm test
        env:
          C4A_PYTHON: python
          C4A_REQUIRE_PYTHON: "1"
          C4A_REQUIRE_FRAMEWORKS: "1"

  mutations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: .
        run: python -m pip install .
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - name: Every mutation is caught, the no-op control is not
        run: npm run mutations
        env:
          C4A_PYTHON: python
          C4A_REQUIRE_PYTHON: "1"
          C4A_REQUIRE_FRAMEWORKS: "1"
