name: properties

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"      # Mondays 03:17 UTC: the long run

permissions:
  contents: read

jobs:
  properties:
    if: github.event_name != 'schedule'
    name: properties ${{ matrix.os }} py3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the kit (no dependencies) and hypothesis (test only)
        run: python -m pip install . hypothesis
      - run: python -m tests.test_properties --require-hypothesis

  properties-long:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: properties long run (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the kit (no dependencies) and hypothesis (test only)
        run: python -m pip install . hypothesis
      - name: long run (the seed is printed; rerun with --long --seed N)
        run: python -m tests.test_properties --require-hypothesis --long
