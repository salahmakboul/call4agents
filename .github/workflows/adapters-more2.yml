name: adapters-more2

# Google ADK and Microsoft Agent Framework adapters, with the real frameworks (scripted models, offline).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapters-more2:
    name: ADK + Agent Framework ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the kit and the two frameworks
        run: python -m pip install . google-adk agent-framework-core
      - name: show versions
        run: python -m pip show google-adk agent-framework-core
      - name: adapters with the real frameworks (offline)
        run: python -m tests.test_adapters_more2 --require-frameworks
