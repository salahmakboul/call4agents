name: bench

# The open crash-safety benchmark (bench/README.md) on Linux, macOS and Windows.
# It keeps the results as an artifact and never commits them: bench/RESULTS.md changes only by a reviewed PR.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"      # Mondays 04:17 UTC

permissions:
  contents: read

jobs:
  bench:
    name: bench ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the tag of the released call4agents the benchmark compares with
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install the frameworks (call4agents itself is run from this checkout and from the release tag)
        run: python -m pip install langgraph langgraph-checkpoint-sqlite pydantic-ai openai-agents openai pydantic
      - name: the benchmark can see a failure
        run: python -m bench.selfcheck
      - name: run the benchmark
        shell: bash
        run: |
          mkdir -p bench-out
          python -m bench.run --require-frameworks --out bench-out || echo "some cells are INVALID; see the JSON"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench-out/
          if-no-files-found: error
