name: Report a problem or tell us what is missing
description: A few short questions. Nothing is collected automatically.
body:
  - type: textarea
    id: doctor
    attributes:
      label: Your system
      description: Run `call4agents doctor` and paste the output (it prints system, Python and framework versions; it sends nothing).
      render: text
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      options:
        - LangGraph / LangChain
        - Pydantic AI
        - OpenAI Agents SDK
        - MCP
        - Plain Python
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Did `pip install call4agents` and `call4agents quickstart` work?
      options:
        - Both worked
        - Install worked, quickstart failed
        - Install failed
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem, if any
      description: What you did, what you expected, what happened. Please remove secrets and personal data.
  - type: textarea
    id: action
    attributes:
      label: What action do you protect with it?
      description: For example "sending emails", "Stripe charges", "creating tickets".
  - type: textarea
    id: missing
    attributes:
      label: What is missing?
